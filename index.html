<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>誰在三月失了神 - 完整三幕劇</title>
<!-- 引入外部 CSS 樣式表 -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-wrapper">
  
  <!-- 開頭畫面 -->
  <div id="start-screen">
    <div class="main-title">誰在三月失了神</div>
    <div class="sub-title">雙軌共感 敘事體驗</div>
    <button class="start-game-btn" onclick="Flow.startGame()">開始遊戲</button>
  </div>

  <!-- 結尾畫面 -->
  <div id="end-screen">
    <div class="main-title">未完待續</div>
    <div class="sub-title">記憶的波形，仍在回盪...</div>
    <button class="p-btn" style="margin-top:20px; padding: 12px 30px;" onclick="location.reload()">重新體驗</button>
  </div>

  <header>
    <div style="color: #fff;"><strong>誰在三月失了神</strong> <span id="chapter-sub" style="color:#8b949e; font-size:0.8rem; margin-left:6px;"></span></div>
    <div class="badge" id="chapter-badge"></div>
  </header>
  
  <div id="stage-wrap"><canvas id="world-canvas"></canvas><div id="interact-prompt">[E] 互動</div></div>
  
  <div id="mobile-controls">
    <div class="d-pad"><button class="touch-btn" id="btn-left">◀</button><button class="touch-btn" id="btn-right">▶</button></div>
    <button class="interact-btn" id="btn-act">E 互動</button>
  </div>
  
  <div id="dialogue-area">
    <div class="speaker-name" id="speaker-tag"></div>
    <div class="dialogue-body" id="dialogue-text"></div>
    <div class="dialogue-actions" id="dialogue-actions"></div>
  </div>

  <!-- 解謎彈窗區 -->
  <div id="puzzle-overlay">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
      <h3 id="puzzle-title" style="color:var(--memory); font-size:1.1rem;">【共感解謎】</h3>
      <button class="p-btn" onclick="Puzzle.close()" style="padding:6px 12px;">返回</button>
    </div>
    <div class="p-card" id="card-vision">
      <div style="color: #8b949e; border-bottom: 1px solid #1a202c; padding-bottom: 4px; display: flex; justify-content: space-between;"><span id="v-title">程曦：視覺重組</span><span id="p-v-status">未開啟</span></div>
      <div style="height:90px; background:#000; border:1px solid #1a202c; border-radius:4px; overflow:hidden;"><canvas id="vision-canvas" style="width:100%; height:100%;"></canvas></div>
      <div id="touch-ui-area" style="width:100%; height:6px; background:#161b22; border-radius:3px; overflow:hidden; margin-top:4px;"><div id="p-overload-bar" style="width:0%; height:100%; background:var(--accent); transition:0.1s;"></div></div>
      <button class="p-btn" id="p-touch-btn" onmousedown="Puzzle.startTouch()" onmouseup="Puzzle.stopTouch()" ontouchstart="Puzzle.startTouch()" ontouchend="Puzzle.stopTouch()">🖐 按住維持觸摸 (小心過載)</button>
      <button class="p-btn" id="p-rhythm-btn" style="display:none; background:var(--memory); color:#000; font-weight:bold;" onclick="Puzzle.hitRhythm()">🎵 跟隨舞步 (抓準光圈重合)</button>
    </div>
    <div class="p-card" id="card-audio">
      <div style="color: #8b949e; border-bottom: 1px solid #1a202c; padding-bottom: 4px; display: flex; justify-content: space-between;"><span>李相暮：頻率 / 記憶</span><span id="p-a-status" style="color:var(--danger);">高噪訊</span></div>
      <div style="height:90px; background:#000; border:1px solid #1a202c; border-radius:4px; overflow:hidden;"><canvas id="waveform-canvas" style="width:100%; height:100%;"></canvas></div>
      <div id="slider-area" style="margin-top:8px;">
        <div style="font-size:0.8rem; color:#8b949e; display:flex; justify-content:space-between;"><span id="slider1-label">滑桿1</span><span id="slider1-val-txt">60</span></div>
        <input type="range" id="slider1" min="0" max="100" value="0" style="width:100%; accent-color:var(--memory);" oninput="Puzzle.onSlider1(this.value)">
        <div style="font-size:0.8rem; color:#8b949e; display:flex; justify-content:space-between; margin-top:4px;"><span id="slider2-label">滑桿2</span><span id="slider2-val-txt">0</span></div>
        <input type="range" id="slider2" min="0" max="100" value="0" style="width:100%; accent-color:var(--memory);" oninput="Puzzle.onSlider2(this.value)">
      </div>
    </div>
    <button class="sync-act-btn" id="sync-act-btn" onclick="Puzzle.attemptSync()">⚡ 記憶對齊 (SYNC)</button>
  </div>

  <div id="story-modal"><h2 id="modal-title"></h2><p id="modal-desc"></p><button class="p-btn" style="padding:12px 32px; font-weight:bold; background:var(--accent); border:none;" onclick="Flow.onModalConfirm()">繼續</button></div>
</div>

<!-- 引入外部 JavaScript 檔案 -->
<script src="game.js"></script>
</body>
</html>
