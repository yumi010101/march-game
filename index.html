<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- 強制鎖定手機畫面不縮放 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>誰在三月失了神 - 完整修復版</title>
<style>
  :root {
    --bg-dark: #07090e;
    --panel-bg: #11151f;
    --border: #232a3d;
    --text: #ffffff;
    --accent: #58a6ff;
    --memory: #e5b544;
    --danger: #f85149;
    --green: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body {
    background: var(--bg-dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 0; /* 手機上滿版 */
  }
  
  #game-wrapper {
    width: 100%;
    max-width: 800px;
    height: 100vh;
    background: var(--panel-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  header {
    background: #0b0e14;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .badge { color: var(--memory); border: 1px solid var(--memory); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }

  /* 核心解法：強制鎖定 800/320 比例，畫面永不變形 */
  #stage-wrap {
    width: 100%;
    aspect-ratio: 800 / 320;
    background: #020305;
    position: relative;
    flex-shrink: 0;
  }
  canvas#world-canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated; /* 保持像素風格清晰 */
  }

  /* 懸浮提示 */
  #interact-prompt {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(13, 17, 23, 0.95);
    border: 1px solid var(--memory);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    pointer-events: none;
    display: none;
    z-index: 10;
  }

  /* 手機虛擬搖桿 (放大好按) */
  #mobile-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #0b0e14;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .d-pad { display: flex; gap: 16px; }
  .touch-btn {
    width: 70px;
    height: 55px;
    background: #1f2633;
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 8px;
    font-size: 1.5rem;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .touch-btn:active { background: var(--accent); }
  .interact-btn {
    width: 120px;
    height: 55px;
    background: #252e3d;
    border: 1px solid var(--memory);
    color: var(--memory);
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .interact-btn:active { background: var(--memory); color: #000; }

  /* 劇情對話區 */
  #dialogue-area {
    background: #090c12;
    padding: 16px 20px;
    flex-grow: 1; /* 佔滿下方剩餘空間 */
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .speaker-name { font-size: 1rem; font-weight: bold; color: var(--accent); }
  .dialogue-body { font-size: 1.05rem; line-height: 1.6; color: #e6edf3; }
  .action-btn-sm {
    padding: 12px 16px;
    background: #1f242c;
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 6px;
    font-size: 1rem;
    margin-top: 8px;
    cursor: pointer;
    display: inline-block;
  }
  .action-btn-sm:active { background: #30363d; border-color: var(--accent); }

  /* 彈窗畫面 */
  #puzzle-overlay, #story-modal {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: none;
    background: rgba(7, 9, 14, 0.98);
    padding: 20px;
    overflow-y: auto;
    flex-direction: column;
  }
  #puzzle-overlay.show, #story-modal.show { display: flex; }
  .p-card { background: #0b0e14; border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
  .p-btn { padding: 12px; background: #1f242c; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 1rem; }
  .p-btn.active { background: #1f6feb; border-color: #58a6ff; }
  .sync-act-btn { padding: 16px; background: #21262d; border: 1px solid var(--border); color: #c9d1d9; border-radius: 6px; font-size: 1.1rem; font-weight: bold; margin-top: 10px; }
  .sync-act-btn.ready { background: var(--green); color: #fff; }
  #story-modal { justify-content: center; align-items: center; text-align: center; }
  #story-modal h2 { color: var(--memory); margin-bottom: 16px; font-size: 1.4rem; }
  #story-modal p { line-height: 1.8; color: #e6edf3; margin-bottom: 24px; font-size: 1.05rem; white-space: pre-line; }

  /* 若在電腦上開啟，增加圓角與置中 */
  @media (min-width: 800px) {
    body { align-items: center; }
    #game-wrapper { height: 90vh; max-height: 700px; border: 1px solid var(--border); border-radius: 12px; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <header>
    <div style="color: #fff;"><strong>誰在三月失了神</strong> <span id="chapter-sub" style="color:#8b949e; font-size:0.8rem; margin-left:6px;">第一幕 · 咖啡廳</span></div>
    <div class="badge" id="chapter-badge">第 1 場：碎琉璃</div>
  </header>

  <div id="stage-wrap">
    <canvas id="world-canvas"></canvas>
    <div id="interact-prompt">[E] 互動</div>
  </div>

  <div id="mobile-controls">
    <div class="d-pad">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <button class="interact-btn" id="btn-act">E 互動</button>
  </div>

  <div id="dialogue-area">
    <div class="speaker-name" id="speaker-tag">系統</div>
    <div class="dialogue-body" id="dialogue-text">
      咖啡廳正舉行聲音修復講座。吧檯旁傳來琉璃飾品被撞碎的響聲……
    </div>
    <div class="dialogue-actions" id="dialogue-actions"></div>
  </div>

  <!-- 解謎區 -->
  <div id="puzzle-overlay">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
      <h3 style="color:var(--memory); font-size:1.1rem;">【雙軌共感：老戲院檢票打孔器】</h3>
      <button class="p-btn" onclick="Puzzle.close()" style="padding:6px 12px;">返回</button>
    </div>
    <div class="p-card">
      <div style="color: #8b949e; border-bottom: 1px solid #1a202c; padding-bottom: 4px; display: flex; justify-content: space-between;">
        <span>程曦：觸摸共感</span><span id="p-v-status">未開啟</span>
      </div>
      <div style="height:90px; background:#000; border:1px solid #1a202c; border-radius:4px; overflow:hidden;">
        <canvas id="vision-canvas" style="width:100%; height:100%;"></canvas>
      </div>
      <div style="width:100%; height:6px; background:#161b22; border-radius:3px; overflow:hidden; margin-top:4px;">
        <div id="p-overload-bar" style="width:0%; height:100%; background:var(--accent); transition:0.1s;"></div>
      </div>
      <button class="p-btn" id="p-touch-btn" onclick="Puzzle.toggleTouch()">🖐 脫下手套觸摸打孔器 (聚焦)</button>
    </div>
    <div class="p-card">
      <div style="color: #8b949e; border-bottom: 1px solid #1a202c; padding-bottom: 4px; display: flex; justify-content: space-between;">
        <span>李相暮：頻率去噪</span><span id="p-a-status" style="color:var(--danger);">高噪訊</span>
      </div>
      <div style="height:90px; background:#000; border:1px solid #1a202c; border-radius:4px; overflow:hidden;">
        <canvas id="waveform-canvas" style="width:100%; height:100%;"></canvas>
      </div>
      <div style="margin-top:8px;">
        <div style="font-size:0.8rem; color:#8b949e; display:flex; justify-content:space-between;"><span>低頻切除 (HPF)</span><span id="hpf-val-txt">60 Hz</span></div>
        <input type="range" id="slider-hpf" min="20" max="500" value="60" style="width:100%; accent-color:var(--memory);" oninput="Puzzle.onHpf(this.value)">
      </div>
      <div style="margin-top:4px;">
        <div style="font-size:0.8rem; color:#8b949e; display:flex; justify-content:space-between;"><span>人聲帶通 (BPF)</span><span id="bpf-val-txt">2900 Hz</span></div>
        <input type="range" id="slider-bpf" min="400" max="3500" value="2900" style="width:100%; accent-color:var(--memory);" oninput="Puzzle.onBpf(this.value)">
      </div>
    </div>
    <button class="sync-act-btn" id="sync-act-btn" onclick="Puzzle.attemptSync()">⚡ 雙軌記憶對齊 (SYNC)</button>
  </div>

  <div id="story-modal">
    <h2 id="modal-title">標題</h2>
    <p id="modal-desc">內容</p>
    <button class="p-btn" id="modal-next-btn" style="padding:12px 32px; font-weight:bold;" onclick="Flow.onModalConfirm()">繼續章節</button>
  </div>
</div>

<script>
// 圖片載入系統
const Assets = {
  chengxiImg: new Image(),
  xiangmuImg: new Image(),
  theaterBg: new Image(),
  chengxiLoaded: false,
  xiangmuLoaded: false,
  theaterBgLoaded: false,

  init() {
    this.chengxiImg.src = 'chengxi.png';
    this.chengxiImg.onload = () => { this.chengxiLoaded = true; };
    this.xiangmuImg.src = 'xiangmu.png';
    this.xiangmuImg.onload = () => { this.xiangmuLoaded = true; };
    this.theaterBg.src = 'theater-bg.png';
    this.theaterBg.onload = () => { this.theaterBgLoaded = true; };
  }
};

const Sfx = {
  ctx: null, filterNode: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const bufSize = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = this.ctx.createBufferSource();
    noise.buffer = buf; noise.loop = true;
    this.filterNode = this.ctx.createBiquadFilter();
    this.filterNode.type = 'bandpass';
    this.filterNode.frequency.value = 1000;
    this.filterNode.Q.value = 3;
    const gain = this.ctx.createGain(); gain.gain.value = 0.03;
    noise.connect(this.filterNode).connect(gain).connect(this.ctx.destination);
    noise.start();
  },
  playStep() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(130 + Math.random() * 20, this.ctx.currentTime);
    g.gain.setValueAtTime(0.04, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.1);
    osc.connect(g).connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.1);
  },
  playChimes() {
    if (!this.ctx) return;
    [311, 392, 466, 622].forEach((f, i) => {
      const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.1);
      g.gain.setValueAtTime(0.08, this.ctx.currentTime + i * 0.1); g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 2.5);
      osc.connect(g).connect(this.ctx.destination); osc.start(this.ctx.currentTime + i * 0.1); osc.stop(this.ctx.currentTime + 2.6);
    });
  }
};

const Flow = {
  currentAct: 1,
  setAct(act) {
    this.currentAct = act;
    const sub = document.getElementById('chapter-sub'); const badge = document.getElementById('chapter-badge');
    const dTag = document.getElementById('speaker-tag'); const dText = document.getElementById('dialogue-text');
    const dActions = document.getElementById('dialogue-actions'); dActions.innerHTML = '';
    if (act === 1) {
      sub.innerText = "第一幕 · 咖啡廳"; badge.innerText = "第 1 場：碎琉璃";
      World.player.x = 200; World.partner.x = 600;
      dTag.innerText = "李相暮"; dText.innerText = "妳的手套滲血了，不要動。用這條手帕止血吧。";
      dActions.innerHTML = `<button class="action-btn-sm" onclick="Flow.cafeGiveHandkerchief()">【接過手帕止血】</button>`;
    } else if (act === 2) {
      sub.innerText = "第二幕 · 老戲院"; badge.innerText = "第 14-18 場：舊打孔器";
      World.player.x = 120; World.partner.x = 640;
      dTag.innerText = "程曦"; dText.innerText = "空氣裡有一種受潮的味道……李相暮，走到中間檢查售票鐵盒。";
    } else if (act === 3) {
      sub.innerText = "第三幕 · 基隆防波堤"; badge.innerText = "第 92-94 場：雨夜告別";
      World.player.x = 160; World.partner.x = 580;
      dTag.innerText = "李相暮"; dText.innerText = "晚上很冷，海風這麼大，妳怎麼一個人跑來這裡？……手套呢？";
      dActions.innerHTML = `<button class="action-btn-sm" onclick="Flow.breakwaterDropGlove()">【撿起手套，披上外套】</button>`;
    }
  },
  cafeGiveHandkerchief() {
    document.getElementById('speaker-tag').innerText = "程曦";
    document.getElementById('dialogue-text').innerText = "「……謝謝。但你的修復音樂太乾淨了，把真實的破音都當成垃圾丟掉了。」";
    document.getElementById('dialogue-actions').innerHTML = `<button class="action-btn-sm" onclick="Flow.showModal('【受邀參與電影創作】', '李相暮收回手帕：『聲音若沒有人聽得懂，就沒有留存的意義。』\\n數日後，兩人一同前往基隆老戲院。')">前往老戲院 ➔</button>`;
  },
  breakwaterDropGlove() {
    Sfx.playChimes();
    document.getElementById('speaker-tag').innerText = "程曦";
    document.getElementById('dialogue-text').innerText = "灰色手套滑落積水裡。李相暮彎腰替她撿起，將大衣披上她的肩頭。";
    document.getElementById('dialogue-actions').innerHTML = `<button class="action-btn-sm" onclick="Flow.showModal('【終局：三月的基隆港】', '「我三月要去巴黎了。」李相暮望向海面。\\n「那裡應該沒有雜音吧？」程曦輕聲問。\\n海風中，只有微弱的心跳鋼琴旋律流淌。')">查看尾聲 ➔</button>`;
  },
  showModal(title, desc) {
    document.getElementById('modal-title').innerText = title; document.getElementById('modal-desc').innerText = desc;
    document.getElementById('story-modal').classList.add('show');
  },
  onModalConfirm() {
    document.getElementById('story-modal').classList.remove('show');
    if (this.currentAct === 1) this.setAct(2); else if (this.currentAct === 2) this.setAct(3); else location.reload();
  }
};

const World = {
  canvas: null, ctx: null, keys: {},
  player: { x: 200, y: 190, speed: 4, dir: 1, isMoving: false, walkFrame: 0 },
  partner: { x: 600, y: 190 }, activePrompt: null,

  init() {
    Assets.init();
    this.canvas = document.getElementById('world-canvas');
    this.ctx = this.canvas.getContext('2d');
    
    // 【絕不動搖的核心：內部鎖死 800x320】
    this.canvas.width = 800;
    this.canvas.height = 320;
    this.ctx.imageSmoothingEnabled = false;

    window.addEventListener('keydown', (e) => { this.keys[e.key.toLowerCase()] = true; if(e.key.toLowerCase()==='e') this.handleInteract(); Sfx.init(); });
    window.addEventListener('keyup', (e) => { this.keys[e.key.toLowerCase()] = false; });
    this.setupTouch('btn-left', 'arrowleft'); this.setupTouch('btn-right', 'arrowright');
    document.getElementById('btn-act').addEventListener('touchstart', (e) => { e.preventDefault(); Sfx.init(); this.handleInteract(); });
    Flow.setAct(1); this.loop();
  },
  setupTouch(id, key) {
    const el = document.getElementById(id);
    const press = (e) => { e.preventDefault(); Sfx.init(); this.keys[key] = true; };
    const rel = (e) => { e.preventDefault(); this.keys[key] = false; };
    el.addEventListener('touchstart', press); el.addEventListener('touchend', rel);
  },
  handleInteract() {
    if (Flow.currentAct === 1 && this.activePrompt === 'PARTNER') Flow.cafeGiveHandkerchief();
    else if (Flow.currentAct === 2) {
      if (this.activePrompt === 'ITEM') Puzzle.open();
      if (this.activePrompt === 'PARTNER') {
        document.getElementById('speaker-tag').innerText = "李相暮"; document.getElementById('dialogue-text').innerText = "「這戲院的空氣殘響長達五秒半……快觸碰鐵盒看看。」";
      }
    }
    else if (Flow.currentAct === 3 && this.activePrompt === 'PARTNER') Flow.breakwaterDropGlove();
  },
  update() {
    let moving = false;
    if (this.keys['a'] || this.keys['arrowleft']) { this.player.x -= this.player.speed; this.player.dir = -1; moving = true; }
    if (this.keys['d'] || this.keys['arrowright']) { this.player.x += this.player.speed; this.player.dir = 1; moving = true; }
    this.player.x = Math.max(60, Math.min(740, this.player.x));
    this.player.isMoving = moving;
    if (moving) { this.player.walkFrame += 0.2; if (Math.sin(this.player.walkFrame) > 0.9) Sfx.playStep(); }

    const prompt = document.getElementById('interact-prompt');
    const distP = Math.abs(this.player.x - this.partner.x); const distI = Math.abs(this.player.x - 380);
    if (Flow.currentAct === 2 && distI < 70) {
      this.activePrompt = 'ITEM'; prompt.style.display = 'block'; prompt.innerText = "點擊 [E] 調查鐵盒";
    } else if (distP < 80) {
      this.activePrompt = 'PARTNER'; prompt.style.display = 'block'; prompt.innerText = "點擊 [E] 互動";
    } else { this.activePrompt = null; prompt.style.display = 'none'; }
  },
  draw() {
    const ctx = this.ctx; ctx.clearRect(0, 0, 800, 320);

    if (Flow.currentAct === 1) {
      ctx.fillStyle = "#140f0c"; ctx.fillRect(0, 0, 800, 210);
      ctx.fillStyle = "#2b1e16"; ctx.fillRect(0, 210, 800, 110);
    } else if (Flow.currentAct === 2) {
      if (Assets.theaterBgLoaded) {
        ctx.drawImage(Assets.theaterBg, 0, 0, 800, 320);
      } else {
        ctx.fillStyle = "#0a0d14"; ctx.fillRect(0, 0, 800, 210);
        ctx.fillStyle = "#121722"; ctx.fillRect(0, 210, 800, 110);
      }
      ctx.fillStyle = "#1e2533"; ctx.fillRect(340, 190, 75, 45);
      ctx.fillStyle = "#e5b544"; ctx.fillRect(368, 184, 18, 10);
    } else if (Flow.currentAct === 3) {
      ctx.fillStyle = "#050912"; ctx.fillRect(0, 0, 800, 210);
      ctx.fillStyle = "#0b121e"; ctx.fillRect(0, 210, 800, 110);
    }

    this.renderXiangMu(this.partner.x, this.partner.y);
    this.renderChengXi(this.player.x, this.player.y, this.player.dir, this.player.isMoving ? Math.sin(this.player.walkFrame)*4 : 0);
  },
  renderChengXi(x, y, dir, bounce) {
    const ctx = this.ctx; ctx.save(); ctx.translate(x, y + bounce); ctx.scale(dir, 1);
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(0, 72, 24, 8, 0, 0, Math.PI * 2); ctx.fill();
    if (Assets.chengxiLoaded) {
      const drawH = 145; const drawW = (Assets.chengxiImg.width / Assets.chengxiImg.height) * drawH;
      ctx.drawImage(Assets.chengxiImg, -drawW / 2, -65, drawW, drawH);
    } else {
      ctx.fillStyle = "#3e2723"; ctx.fillRect(-14, -34, 8, 30); ctx.fillStyle = "#f5d0b5"; ctx.fillRect(-7, -44, 15, 16);
      ctx.fillStyle = "#f0f4f8"; ctx.fillRect(-9, -26, 20, 24); ctx.fillStyle = "#6d4c41"; ctx.fillRect(-13, -2, 26, 46);
    }
    ctx.restore();
  },
  renderXiangMu(x, y) {
    const ctx = this.ctx; ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(0, 74, 26, 8, 0, 0, Math.PI * 2); ctx.fill();
    if (Assets.xiangmuLoaded) {
      const drawH = 152; const drawW = (Assets.xiangmuImg.width / Assets.xiangmuImg.height) * drawH;
      ctx.drawImage(Assets.xiangmuImg, -drawW / 2, -70, drawW, drawH);
    } else {
      ctx.fillStyle = "#1a1f2c"; ctx.fillRect(-8, -48, 16, 14); ctx.fillStyle = "#ebd0bc"; ctx.fillRect(-7, -36, 15, 15);
      ctx.fillStyle = "#1e2430"; ctx.fillRect(-10, -14, 20, 48); ctx.fillStyle = "#161b24"; ctx.fillRect(-10, 34, 8, 40); ctx.fillRect(2, 34, 8, 40);
    }
    ctx.restore();
  },
  loop() { this.update(); this.draw(); requestAnimationFrame(() => this.loop()); }
};

const Puzzle = {
  isTouch: false, overload: 0, clarity: 0.1, hpf: 60, bpf: 2900, isVReady: false, isAReady: false, phase: 0,
  open() { document.getElementById('puzzle-overlay').classList.add('show'); this.vC = document.getElementById('vision-canvas'); this.vCtx = this.vC.getContext('2d'); this.vC.width = 300; this.vC.height = 90; this.wC = document.getElementById('waveform-canvas'); this.wCtx = this.wC.getContext('2d'); this.wC.width = 300; this.wC.height = 90; this.puzzleLoop(); },
  close() { document.getElementById('puzzle-overlay').classList.remove('show'); this.isTouch = false; },
  toggleTouch() { this.isTouch = !this.isTouch; },
  onHpf(v) { this.hpf = parseInt(v); document.getElementById('hpf-val-txt').innerText = `${this.hpf} Hz`; this.eval(); },
  onBpf(v) { this.bpf = parseInt(v); document.getElementById('bpf-val-txt').innerText = `${this.bpf} Hz`; if (Sfx.filterNode) Sfx.filterNode.frequency.setTargetAtTime(this.bpf, Sfx.ctx.currentTime, 0.05); this.eval(); },
  eval() {
    this.isAReady = (this.hpf >= 260 && this.bpf >= 900 && this.bpf <= 1300);
    const s = document.getElementById('p-a-status'); s.innerText = this.isAReady ? "【人聲鎖定】" : "搜尋中..."; s.style.color = this.isAReady ? "var(--green)" : "var(--danger)";
    document.getElementById('sync-act-btn').className = this.isVReady && this.isAReady ? 'sync-act-btn ready' : 'sync-act-btn';
  },
  attemptSync() { if (this.isVReady && this.isAReady) { Sfx.playChimes(); this.close(); Flow.showModal('【1947 年老戲院檢票口】', '小男孩抱膝在大廳角落大哭。\n年輕軍人何明傑手裡捏著電影票根，蹲下身摸摸孩子的頭。\n\n程曦收回手指：「那位軍官……就是戲院老闆失蹤的父親！」'); } else alert("未完全對齊。"); },
  puzzleLoop() {
    if (!document.getElementById('puzzle-overlay').classList.contains('show')) return;
    this.overload = this.isTouch ? Math.min(100, this.overload + 0.35) : Math.max(0, this.overload - 0.5);
    this.clarity = this.isTouch ? Math.min(1.0, this.clarity + 0.015) : Math.max(0.1, this.clarity - 0.015);
    if (this.overload >= 100) { this.isTouch = false; alert("【感官過載】"); }
    document.getElementById('p-overload-bar').style.width = `${this.overload}%`;
    this.isVReady = (this.clarity >= 0.85);
    const vStat = document.getElementById('p-v-status'); vStat.innerText = this.isVReady ? "【清晰】" : "聚焦中"; vStat.style.color = this.isVReady ? "var(--memory)" : "#8b949e";
    document.getElementById('sync-act-btn').className = this.isVReady && this.isAReady ? 'sync-act-btn ready' : 'sync-act-btn';
    
    this.vCtx.fillStyle = "#05070a"; this.vCtx.fillRect(0, 0, 300, 90);
    this.vCtx.save(); this.vCtx.translate(150, 45); this.vCtx.globalAlpha = this.clarity; this.vCtx.strokeStyle = this.isVReady ? "#e5b544" : "#8b949e"; this.vCtx.lineWidth = 1.5; this.vCtx.beginPath(); this.vCtx.arc(-20, 8, 8, 0, Math.PI*2); this.vCtx.stroke(); this.vCtx.restore();
    
    this.wCtx.fillStyle = "#030406"; this.wCtx.fillRect(0, 0, 300, 90);
    this.wCtx.strokeStyle = this.isAReady ? "#3fb950" : "#f85149"; this.wCtx.beginPath();
    for(let i=0; i<=30; i++) { const x = i*10; const y = 45 + Math.sin(i*0.4 + this.phase) * (this.isAReady ? 10 : 20) * (this.isAReady ? Math.sin(i*0.3+this.phase) : (Math.random()-0.5)*2); if(i===0) this.wCtx.moveTo(x,y); else this.wCtx.lineTo(x,y); }
    this.wCtx.stroke(); this.phase += 0.15;
    requestAnimationFrame(() => this.puzzleLoop());
  }
};
window.onload = () => World.init();
</script>
