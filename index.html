<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>誰在三月失了神</title>
<!-- ★ 新增：在 HTML 頂部就告訴瀏覽器，低優先級在背景偷偷下載這兩張圖 -->
<link rel="preload" as="image" href="theater-bg.png?v=13" fetchpriority="high">
<link rel="preload" as="image" href="chengxi.png?v=13" fetchpriority="high">
<link rel="preload" as="image" href="xiangmu.png?v=13" fetchpriority="high">
<link rel="preload" as="image" href="room-bg.png?v=13" fetchpriority="low">
<link rel="preload" as="image" href="bar-bg.png?v=13" fetchpriority="low">
<style>
  :root { --bg-dark: #050608; --panel-bg: #11151f; --border: #232a3d; --text: #ffffff; --accent: #58a6ff; --memory: #e5b544; --danger: #f85149; --green: #3fb950; }

  html, body { height: 100%; height: 100dvh; width: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg-dark); }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  body { display: flex; justify-content: center; align-items: center; color: var(--text); font-family: -apple-system, sans-serif; }

  #game-wrapper { width: 100%; max-width: 550px; height: 100%; height: 100dvh; background: var(--bg-dark); display: flex; flex-direction: column; position: relative; overflow: hidden; margin: 0 auto; }

  header { background: #0b0e14; border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; font-size: 0.85rem;}
  .badge { color: var(--memory); border: 1px solid var(--memory); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }

  #stage-wrap { width: 100%; aspect-ratio: 4 / 3; background: #1c140f; position: relative; flex-shrink: 0; border-bottom: 2px solid #0f131a; overflow: hidden; }
  canvas#world-canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }
  #interact-prompt { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); background: rgba(13,17,23,0.95); border: 1px solid var(--memory); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; display: none; z-index: 10; }

  #mobile-controls { display: flex; justify-content: space-between; align-items: center; padding: 8px 20px; background: #0b0e14; border-bottom: 1px solid var(--border); flex-shrink: 0; transition: opacity .2s; }
  #mobile-controls.disabled { opacity: .42; }
  #mobile-controls.disabled .touch-btn, #mobile-controls.disabled .interact-btn { pointer-events: none; }
  .d-pad { display: flex; gap: 14px; }
  .touch-btn, .interact-btn { height: 48px; background: #1f2633; border: 1px solid var(--border); color: #fff; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; touch-action: none; transition: 0.2s; }
  .touch-btn { width: 60px; font-size: 1.4rem; }
  .interact-btn { width: 110px; background: #252e3d; border-color: var(--memory); color: var(--memory); font-size: 1.1rem; font-weight: bold; letter-spacing: 1px; }
  .touch-btn:active, .interact-btn:active { transform: scale(0.95); }

  #dialogue-area { background: linear-gradient(180deg, #121722 0%, #050608 100%); padding: 12px 20px max(12px, env(safe-area-inset-bottom)); flex: 1; min-height: 150px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; touch-action: pan-y; box-shadow: inset 0 10px 20px rgba(0,0,0,0.3); }
  .speaker-name { font-size: 1rem; font-weight: bold; color: var(--accent); flex-shrink: 0; letter-spacing: 1px; }
  .dialogue-body { font-size: 1rem; line-height: 1.5; color: #e6edf3; flex-shrink: 0; letter-spacing: 0.5px; }

  .action-btn-sm { padding: 12px 18px; background: rgba(31,38,51,0.8); border: 1px solid #3d4b66; color: #fff; border-radius: 8px; font-size: 1rem; cursor: pointer; display: block; width: 100%; margin-top: auto; text-align: center; transition: 0.2s; }
  .action-btn-sm:active { background: #3d4b66; }

  #puzzle-overlay, #story-modal { position: absolute; inset: 0; z-index: 50; display: none; background: rgba(5,6,8,0.98); padding: 20px; overflow-y: auto; flex-direction: column; touch-action: pan-y; }
  #puzzle-overlay.show, #story-modal.show { display: flex; }
  .p-card { background: #0b0e14; border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
  .p-btn { padding: 12px; background: #1f242c; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  .sync-act-btn { padding: 16px; background: #21262d; border: 1px solid var(--border); color: #c9d1d9; border-radius: 6px; font-size: 1.1rem; font-weight: bold; margin-top: 10px; cursor: pointer; transition: 0.3s; }
  .sync-act-btn.ready { background: var(--green); color: #fff; box-shadow: 0 0 15px rgba(63,185,80,0.4); }

  #story-modal { justify-content: center; align-items: center; text-align: center; } #story-modal h2 { color: var(--memory); margin-bottom: 16px; font-size: 1.4rem; } #story-modal p { line-height: 1.8; color: #e6edf3; margin-bottom: 24px; font-size: 1.05rem; white-space: pre-line; }
  #start-screen, #end-screen { position: absolute; inset: 0; z-index: 100; background: #040609; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  #asset-loading { width: min(320px, 78%); margin-top: 18px; color:#8b949e; font-size:.82rem; line-height:1.6; }
  #asset-progress { width:100%; height:6px; margin-top:8px; border-radius:99px; background:#1f2633; overflow:hidden; }
  #asset-progress-bar { width:0%; height:100%; background:var(--accent); transition:width .2s ease; }
  .start-game-btn:disabled { opacity:.45; cursor:wait; box-shadow:none; }
  #end-screen { display: none; }
  .main-title { font-size: 2.2rem; font-weight: bold; color: var(--memory); margin-bottom: 12px; letter-spacing: 4px; }
  .sub-title { font-size: 1rem; color: #8b949e; margin-bottom: 40px; letter-spacing: 2px; }
  .start-game-btn { padding: 16px 40px; font-size: 1.2rem; font-weight: bold; background: var(--accent); color: #fff; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(88,166,255,0.3); transition: 0.2s; }
  .start-game-btn:active { transform: scale(0.95); background: #3b8eed; }

  @media (min-width: 600px) { #game-wrapper { height: 95vh; max-height: 900px; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); } }
</style>
</head>
<body>
<div id="game-wrapper">
  <div id="start-screen"><div class="main-title">誰在三月失了神</div><div class="sub-title">雙軌共感 敘事體驗</div><button class="start-game-btn" id="start-game-btn" onclick="Flow.startGame()" disabled>場景載入中…</button><div id="asset-loading">正在載入第一幕場景…<div id="asset-progress"><div id="asset-progress-bar"></div></div></div></div>
  <div id="end-screen"><div class="main-title">未完待續</div><div class="sub-title">記憶的波形，仍在回盪...</div><button class="p-btn" style="margin-top:20px; padding: 12px 30px;" onclick="location.reload()">重新體驗</button></div>
  <header><div style="color: #fff;"><strong>誰在三月失了神</strong> <span id="chapter-sub" style="color:#8b949e; font-size:0.8rem; margin-left:6px;"></span></div><div class="badge" id="chapter-badge"></div></header>
  <div id="stage-wrap"><canvas id="world-canvas"></canvas><div id="interact-prompt">[E] 互動</div></div>
  <div id="mobile-controls"><div class="d-pad"><button class="touch-btn" id="btn-left">◀</button><button class="touch-btn" id="btn-right">▶</button></div><button class="interact-btn" id="btn-act">E 互動</button></div>
  <div id="dialogue-area"><div class="speaker-name" id="speaker-tag"></div><div class="dialogue-body" id="dialogue-text"></div><div class="dialogue-actions" id="dialogue-actions"></div></div>

  <div id="puzzle-overlay">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;"><h3 id="puzzle-title" style="color:var(--memory); font-size:1.1rem;">【共感解謎】</h3><button class="p-btn" onclick="Puzzle.close()" style="padding:6px 12px;">返回</button></div>
    <div class="p-card" id="card-vision"><div style="color: #8b949e; border-bottom: 1px solid #1a202c; padding-bottom: 4px; display: flex; justify-content: space-between;"><span id="v-title">程曦：視覺重組</span><span id="p-v-status">未開啟</span></div><div style="height:90px; background:#000; border:1px solid #1a202c; border-radius:4px; overflow:hidden;"><canvas id="vision-canvas" style="width:100%; height:100%;"></canvas></div><div id="touch-ui-area" style="width:100%; height:6px; background:#161b22; border-radius:3px; overflow:hidden; margin-top:4px;"><div id="p-overload-bar" style="width:0%; height:100%; background:var(--accent); transition:0.1s;"></div></div><button class="p-btn" id="p-touch-btn">🖐 點擊觸摸黑膠</button><button class="p-btn" id="p-rhythm-btn" style="display:none; background:var(--memory); color:#000; font-weight:bold;" onclick="Puzzle.hitRhythm()">🎵 跟隨舞步 (抓準光圈重合)</button></div>
    <div class="p-card" id="card-audio"><div style="color: #8b949e; border-bottom: 1px solid #1a202c; padding-bottom: 4px; display: flex; justify-content: space-between;"><span>李相暮：頻率 / 記憶</span><span id="p-a-status" style="color:var(--danger);">高噪訊</span></div><div style="height:90px; background:#000; border:1px solid #1a202c; border-radius:4px; overflow:hidden;"><canvas id="waveform-canvas" style="width:100%; height:100%;"></canvas></div><div id="slider-area" style="margin-top:8px;"><div style="font-size:0.8rem; color:#8b949e; display:flex; justify-content:space-between;"><span id="slider1-label">滑桿1</span><span id="slider1-val-txt">60</span></div><input type="range" id="slider1" min="0" max="100" value="0" style="width:100%; accent-color:var(--memory);" oninput="Puzzle.onSlider1(this.value)"><div style="font-size:0.8rem; color:#8b949e; display:flex; justify-content:space-between; margin-top:4px;"><span id="slider2-label">滑桿2</span><span id="slider2-val-txt">0</span></div><input type="range" id="slider2" min="0" max="100" value="0" style="width:100%; accent-color:var(--memory);" oninput="Puzzle.onSlider2(this.value)"></div></div>
    <button class="sync-act-btn" id="sync-act-btn" onclick="Puzzle.attemptSync()">⚡ 記憶對齊 (SYNC)</button>
  </div>
</div>

<script>
var Sound = {
  bgm: new Audio('bgm.mp3'),
  interact: new Audio('interact.mp3'),
  init() {
    this.bgm.loop = true;          
    this.bgm.volume = 0.4;         
    this.interact.volume = 1.0;    
  },
  playBGM() {
    this.bgm.play().catch(e => console.log("BGM 播放失敗，等待互動後播放"));
  },
  playInteract() {
    this.interact.currentTime = 0; 
    this.interact.play().catch(e => console.log("音效播放失敗"));
  }
};

var Assets = {
  VERSION: '13',
  chengxiImg: new Image(), theaterBg: new Image(), xiangmuImg: new Image(), roomBg: new Image(), barBg: new Image(),
  _loaded: 0, _required: 3,
  _failed: [],
  _version: 0,          
  src(name) { return name + '?v=' + this.VERSION; },
  mark(img, label) {
    this._version++;
    if (img.dataset.required !== '1') return;   
    if (img.dataset.ready === '1' || img.dataset.failed === '1') return;
    img.dataset.ready = '1';
    this._loaded++;
    if (this._loaded >= this._required) {
      const btn = document.getElementById('start-game-btn');
      const loading = document.getElementById('asset-loading');
      if (btn) { btn.disabled = false; btn.innerText = '開始遊戲'; }
      if (loading) loading.innerHTML = '第一幕場景已準備完成';
    }
    const bar = document.getElementById('asset-progress-bar');
    if (bar) bar.style.width = Math.min(100, Math.round(this._loaded / this._required * 100)) + '%';
  },
  fail(img, label) {
    this._version++;
    if (img.dataset.required !== '1') return;   
    if (img.dataset.ready === '1' || img.dataset.failed === '1') return;
    img.dataset.failed = '1'; this._failed.push(label);
    const bar = document.getElementById('asset-progress-bar');
    if (bar) bar.style.width = Math.min(100, Math.round((this._loaded + this._failed.length) / this._required * 100)) + '%';
    const btn = document.getElementById('start-game-btn');
    const loading = document.getElementById('asset-loading');
    if (this._failed.length && loading) loading.innerHTML = '部分圖片載入失敗，但仍可嘗試進入遊戲';
    if (btn) { btn.disabled = false; btn.innerText = '開始遊戲'; }
  },
  init() {
    const bind = (img, name, label, required) => {
      img.dataset.required = required ? '1' : '0';
      img.decoding = 'async';
      try { img.fetchPriority = required ? 'high' : 'low'; } catch (_) {}
      img.onload = () => this.mark(img, label);
      img.onerror = () => this.fail(img, label);
      img.src = this.src(name);
    };
    // 優先下載並綁定首頁需要的三張圖
    bind(this.chengxiImg, 'chengxi.png', '程曦', true);
    bind(this.theaterBg, 'theater-bg.png', '戲院背景', true);
    bind(this.xiangmuImg, 'xiangmu.png', '李相暮', true);

    // ★ 關鍵優化：稍微延遲半秒後，直接在背後偷偷把後面兩關的背景載入，不再等玩家按「開始遊戲」才載入
    setTimeout(() => {
      bind(this.roomBg, 'room-bg.png', '房間背景', false);
      bind(this.barBg, 'bar-bg.png', '酒吧背景', false);
    }, 500);
  }
};

var Flow = {
  currentAct: 2, canInteract: false, dialogueActive: false, dialogueQueue: [], onDialogueEnd: null,
  
  startGame() { 
    document.getElementById('start-screen').style.display = 'none'; 
    this.setAct(2); 
    // ★ 移除了 Assets.loadRest()，因為現在已經提早偷跑載入了
    World.start(); 
    Sound.playBGM(); 
  },
  
  setControlsEnabled(enabled) {
    const controls = document.getElementById('mobile-controls');
    if (!controls) return;
    controls.classList.toggle('disabled', !enabled);
    controls.setAttribute('aria-disabled', String(!enabled));
  },
  endGame() { this.canInteract = false; this.dialogueActive = false; this.setControlsEnabled(false); document.getElementById('interact-prompt').style.display = 'none'; document.getElementById('end-screen').style.display = 'flex'; World.stop(); },
  startDialogue(queue, callback) {
    this.canInteract = false;
    this.dialogueActive = true;
    this.setControlsEnabled(false);
    document.getElementById('interact-prompt').style.display = 'none';
    this.dialogueQueue = [...queue]; this.onDialogueEnd = callback; this.nextDialogue();
  },
  nextDialogue() {
    const dTag = document.getElementById('speaker-tag'); const dText = document.getElementById('dialogue-text'); const dActions = document.getElementById('dialogue-actions');
    if (this.dialogueQueue.length === 0) {
      this.dialogueActive = false;
      this.setControlsEnabled(this.canInteract);
      const cb = this.onDialogueEnd; this.onDialogueEnd = null;
      if (cb) cb(); else dActions.innerHTML = "";
      return;
    }
    let current = this.dialogueQueue.shift(); dTag.innerText = current.n; dText.innerText = current.t;
    dActions.innerHTML = `<button class="action-btn-sm" onclick="Flow.nextDialogue()">繼續對話 ➔</button>`;
  },
  setAct(act) {
    this.currentAct = act; this.canInteract = false;
    const sub = document.getElementById('chapter-sub'); const badge = document.getElementById('chapter-badge');
    document.getElementById('dialogue-actions').innerHTML = "";

    if (act === 2) {
      sub.innerText = "第二幕 · 老戲院地下室"; badge.innerText = "第 29 場"; World.player.x = 350; World.player.y = 470; World.partner.x = 1100; World.partner.y = 470;
      this.startDialogue([ { n: "戲院老闆", t: "「這幾張是從戲院地下室翻出來的，泛黃磨損得厲害，你看看有沒有什麼用得上。」" }, { n: "系統", t: "程曦望著那些邊角破損的黑膠唱片，空氣裡有一種受潮的味道。" }, { n: "程曦", t: "(深吸一口氣，緩緩伸出手……)" } ], () => { document.getElementById('dialogue-actions').innerHTML = `<div style="text-align:center; color:#8b949e; font-size:0.85rem; margin-top:auto; padding:6px;">(提示：點擊下方按鈕或按左右鍵移動，走到桌子旁按 E)</div>`; this.canInteract = true; this.setControlsEnabled(true); });
    } else if (act === 3) {
      sub.innerText = "第三幕 · 程曦房間 (夜)"; badge.innerText = "第 37 場"; World.player.x = 600; World.player.y = 470; World.partner.y = 470;
      this.startDialogue([ { n: "系統", t: "夜深人靜，窗簾隨風微動，月光落在程曦的臉上。" }, { n: "系統", t: "地板上，那雙從倉庫裡拿回的舊皮鞋靜靜擺著。" }, { n: "程曦", t: "「海邊……」" }, { n: "系統", t: "她下意識脫下手套，指尖輕觸鞋面，似乎仍有一絲濕氣。隨即，強烈的畫面湧入腦海……" } ], () => { document.getElementById('dialogue-actions').innerHTML = `<div style="text-align:center; color:#8b949e; font-size:0.85rem; margin-top:auto; padding:6px;">(提示: 走到舊皮鞋旁按下 [E] 進入夢境)</div>`; this.canInteract = true; this.setControlsEnabled(true); });
    } else if (act === 4) {
      sub.innerText = "第四幕 · 廢棄音樂酒吧"; badge.innerText = "第 74 場"; World.player.x = 400; World.player.y = 470; World.partner.x = 1050; World.partner.y = 470;
      this.startDialogue([ { n: "陳導", t: "「這裡，我打算作為那場舞會的取景地。」" }, { n: "系統", t: "天光斜灑入封存已久的酒吧，木地板泛著歲月的灰黃，四周貼滿斑駁的牆紙。" }, { n: "系統", t: "程曦走入表演空地，望著地上的老舊痕跡，一面破碎的鏡子映出了程曦的模樣。" } ], () => { document.getElementById('dialogue-actions').innerHTML = `<div style="text-align:center; color:#8b949e; font-size:0.85rem; margin-top:auto; padding:6px;">(提示: 走到破碎鏡子前按 [E])</div>`; this.canInteract = true; this.setControlsEnabled(true); });
    }
  },
  afterVinylPuzzle() { this.canInteract = false; this.startDialogue([ { n: "系統", t: "一個穿著舞鞋的女孩身處昏黃燈光下的舞池，一邊跳舞，一邊哭泣，彷彿在低聲懇求：「不要走……求你……」" }, { n: "系統", t: "程曦猛地回神，手開始顫抖，唱片不穩，輕輕一滑，啪嗒落地。" }, { n: "系統", t: "她驚了一下，迅速後退半步，深吸一口氣，連忙戴上手套。" }, { n: "戲院老闆", t: "「還好吧？這唱片有點年紀了，要小心些。」" }, { n: "程曦", t: "「……對不起。」" }, { n: "戲院老闆", t: "「沒事。這是我偶然間找到的錄影機，看來是我叔叔和我媽媽在練習跳舞，不知道對你們有沒有幫助。」" }, { n: "系統", t: "錄影機裡傳來輕快的圓舞曲。程曦接過錄影機，決定回房間仔細梳理。" } ], () => { document.getElementById('dialogue-actions').innerHTML = `<button class="action-btn-sm" style="background:var(--accent); border:none;" onclick="Flow.setAct(3)">進入下一幕 ➔</button>`; }); },
  afterDreamPuzzle() { this.canInteract = false; this.startDialogue([ { n: "系統", t: "夢境裡，兩人牽手在小巷裡走……畫面漸暗。最後定格在男孩靠近女孩的耳邊，清晰地說了一句：「我愛妳」。" }, { n: "系統", t: "程曦猛地睜眼，一滴眼淚從眼角滴落。她怔怔看向窗外亮起的天空。" }, { n: "程曦", t: "「海邊……」" }, { n: "系統", t: "她急忙披上外套，衝出房門，去敲李相暮的門。" }, { n: "李相暮", t: "「早上七點妳在幹嘛？」" }, { n: "程曦", t: "「海邊、皮鞋、戲院、港口、軍人……」" }, { n: "系統", t: "兩人比對了彼此的殘留記憶與樂譜，發現兩段命運開始重疊。隨後，他們跟著劇組來到了勘景地。" } ], () => { document.getElementById('dialogue-actions').innerHTML = `<button class="action-btn-sm" style="background:var(--accent); border:none;" onclick="Flow.setAct(4)">前往廢棄酒吧 ➔</button>`; }); },
  afterDancePuzzle() { this.canInteract = false; this.startDialogue([ { n: "系統", t: "程曦跟著鏡中殘影的節奏，順利完成了「旋轉」與「跨步」……" }, { n: "系統", t: "但在進行到第三步「單腳重心前傾」時，卻不幸失去平衡，整個人向後倒去！" } ], () => { document.getElementById('dialogue-actions').innerHTML = `<button class="action-btn-sm" style="background:var(--danger); font-size:1.1rem; padding:12px;" onclick="Flow.catchHer()">[E] 李相暮接住她！</button>`; }); },
  catchHer() { this.canInteract = false; this.startDialogue([ { n: "系統", t: "李相暮眼疾手快，一把接住她。" }, { n: "系統", t: "兩人相視，呼吸交錯。" }, { n: "系統", t: "空氣一陣靜默。" } ], () => { document.getElementById('dialogue-actions').innerHTML = `<button class="action-btn-sm" style="background:var(--memory); color:#000; font-weight:bold;" onclick="Flow.endGame()">查看結尾</button>`; }); }
};

var World = {
  canvas: null, ctx: null, keys: {},
  player: { x: 350, y: 470, speed: 6, dir: 1, isMoving: false, walkFrame: 0 },
  partner: { x: 1100, y: 470, dir: -1 },
  activePrompt: null,

  viewportWidth: 800, viewportHeight: 600,
  worldWidth: 1400, worldHeight: 600, cameraX: 0,

  _running: false, _raf: 0, _sig: '',
  _bgCache: {}, _spriteCache: {}, _fallbackCache: {},
  _elPrompt: null, _elOverlay: null,

  init() {
    Assets.init(); this.canvas = document.getElementById('world-canvas');
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    this.canvas.width = 800; this.canvas.height = 600; this.ctx.imageSmoothingEnabled = true;

    this._elPrompt = document.getElementById('interact-prompt');
    this._elOverlay = document.getElementById('puzzle-overlay');
    this._boundLoop = () => this.loop();

    window.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if (key === 'e') { e.preventDefault(); this.handleInteract(); return; }
      this.keys[key] = true;
      if (key === 'arrowleft' || key === 'arrowright' || key === 'a' || key === 'd') e.preventDefault();
    });
    window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.stop();
      else if (document.getElementById('start-screen').style.display === 'none' && document.getElementById('end-screen').style.display !== 'flex') this.start();
    });
    this.setupTouch('btn-left', 'arrowleft'); this.setupTouch('btn-right', 'arrowright');
    const btnAct = document.getElementById('btn-act');
    btnAct.addEventListener('pointerdown', e => { e.preventDefault(); this.handleInteract(); });
  },
  start() { if (this._running) return; this._running = true; this._raf = requestAnimationFrame(this._boundLoop); },
  stop() { this._running = false; if (this._raf) cancelAnimationFrame(this._raf); this._raf = 0; },
  setupTouch(id, key) {
    const el = document.getElementById(id);
    const press = e => {
      e.preventDefault();
      this.keys[key] = true;
      el.classList.add('active');
      if (e.pointerId !== undefined && el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (_) {} }
    };
    const release = e => {
      e.preventDefault();
      this.keys[key] = false;
      el.classList.remove('active');
    };
    el.addEventListener('pointerdown', press);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
  },
  
  handleInteract() {
    if (!Flow.canInteract || Flow.dialogueActive || this._elOverlay.classList.contains('show')) return;
    
    Sound.playInteract(); 
    
    if (this.activePrompt === 'ITEM_VINYL') Puzzle.open(1);
    else if (this.activePrompt === 'ITEM_DREAM') Puzzle.open(2);
    else if (this.activePrompt === 'ITEM_DANCE') Puzzle.open(3);
  },

  update() {
    const puzzleOpen = this._elOverlay.classList.contains('show');
    if (Flow.dialogueActive || puzzleOpen) {
      this.player.isMoving = false;
      return;
    }
    let moving = false;
    if (this.keys['a'] || this.keys['arrowleft']) { this.player.x -= this.player.speed; this.player.dir = -1; moving = true; }
    if (this.keys['d'] || this.keys['arrowright']) { this.player.x += this.player.speed; this.player.dir = 1; moving = true; }

    this.player.x = Math.max(80, Math.min(this.worldWidth - 80, this.player.x));
    this.player.isMoving = moving; if (moving) this.player.walkFrame += 0.2;

    this.cameraX = this.player.x - 400;
    this.cameraX = Math.max(0, Math.min(this.worldWidth - this.viewportWidth, this.cameraX));

    const prompt = this._elPrompt;
    if (!Flow.canInteract) { this.activePrompt = null; if (prompt.style.display !== 'none') prompt.style.display = 'none'; return; }

    let nextPrompt = null, nextText = '';
    if (Flow.currentAct === 2 && Math.abs(this.player.x - 900) < 100) { nextPrompt = 'ITEM_VINYL'; nextText = "點擊 [E] 觸碰黑膠唱片"; }
    else if (Flow.currentAct === 3 && Math.abs(this.player.x - 950) < 100) { nextPrompt = 'ITEM_DREAM'; nextText = "點擊 [E] 觸碰舊皮鞋"; }
    else if (Flow.currentAct === 4 && Math.abs(this.player.x - 700) < 100) { nextPrompt = 'ITEM_DANCE'; nextText = "點擊 [E] 凝視破碎鏡子"; }
    
    if (nextPrompt !== this.activePrompt) {
      this.activePrompt = nextPrompt;
      if (nextPrompt) { prompt.innerText = nextText; prompt.style.display = 'block'; }
      else prompt.style.display = 'none';
    }
  },

  getScaledBg(img, key) {
    if (!img.complete || img.naturalWidth === 0) return null;
    const cached = this._bgCache[key];
    if (cached && cached.nw === img.naturalWidth) return cached.cv;
    const cv = document.createElement('canvas');
    cv.width = this.worldWidth; cv.height = this.worldHeight;
    const cx = cv.getContext('2d');
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, this.worldWidth, this.worldHeight);
    this._bgCache[key] = { cv: cv, nw: img.naturalWidth };
    return cv;
  },
  getScaledSprite(img, key, drawH) {
    if (!img.complete || img.naturalWidth === 0) return null;
    const cached = this._spriteCache[key];
    if (cached && cached.nw === img.naturalWidth) return cached.cv;
    const ratio = (img.naturalWidth / img.naturalHeight) || 0.6;
    const w = Math.max(1, Math.round(ratio * drawH));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = drawH;
    const cx = cv.getContext('2d');
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, w, drawH);
    this._spriteCache[key] = { cv: cv, nw: img.naturalWidth };
    return cv;
  },
  getFallback(act) {
    if (this._fallbackCache[act]) return this._fallbackCache[act];
    const cv = document.createElement('canvas');
    cv.width = this.worldWidth; cv.height = this.worldHeight;
    this.drawFallbackScene(cv.getContext('2d'), act);
    this._fallbackCache[act] = cv;
    return cv;
  },

  needsRedraw() {
    const p = this.player, q = this.partner;
    const sig = Flow.currentAct + '|' + Math.round(this.cameraX) + '|' + Math.round(p.x) + '|' + p.dir + '|' +
                (p.isMoving ? Math.round(p.walkFrame * 10) : 'i') + '|' + Math.round(q.x) + '|' + Math.round(q.y) + '|' + q.dir + '|' + Assets._version;
    if (sig === this._sig) return false;
    this._sig = sig;
    return true;
  },

  draw() {
    this.ctx.clearRect(0, 0, this.viewportWidth, this.viewportHeight);
    this.ctx.save();
    this.ctx.translate(-Math.round(this.cameraX), 0);

    let currentBg = Assets.theaterBg, bgKey = 'theater';
    if (Flow.currentAct === 3) { currentBg = Assets.roomBg; bgKey = 'room'; }
    else if (Flow.currentAct === 4) { currentBg = Assets.barBg; bgKey = 'bar'; }

    const bg = this.getScaledBg(currentBg, bgKey);
    if (bg) this.ctx.drawImage(bg, 0, 0);
    else this.ctx.drawImage(this.getFallback(Flow.currentAct), 0, 0);

    if (Flow.currentAct !== 3) this.renderXiangMu(this.partner.x, this.partner.y, this.partner.dir);
    this.renderChengXi(this.player.x, this.player.y, this.player.dir, this.player.isMoving ? Math.sin(this.player.walkFrame)*4 : 0);

    this.ctx.restore();
  },

  drawFallbackScene(ctx, act) {
    const W = this.worldWidth, H = this.worldHeight;
    ctx.fillStyle = act === 2 ? '#17141a' : act === 3 ? '#121722' : '#171313';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = act === 2 ? '#211c20' : act === 3 ? '#202635' : '#241a19';
    ctx.fillRect(0, 0, W, 330);
    ctx.fillStyle = act === 2 ? '#2b2528' : act === 3 ? '#2a3040' : '#302221';
    ctx.fillRect(0, 330, W, 140);
    ctx.fillStyle = act === 2 ? '#31282a' : act === 3 ? '#302c2a' : '#30231f';
    ctx.fillRect(0, 470, W, 130);
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 2;
    for (let x = 0; x <= W; x += 70) { ctx.beginPath(); ctx.moveTo(x,470); ctx.lineTo(x,600); ctx.stroke(); }
    for (let y = 495; y <= 600; y += 38) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  },
  
  renderChengXi(x, y, dir, bounce) {
    const ctx = this.ctx; ctx.save(); ctx.translate(x, y + bounce); ctx.scale(dir, 1);
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(0, 8, 38, 12, 0, 0, Math.PI * 2); ctx.fill();
    const drawH = 330;
    const sprite = this.getScaledSprite(Assets.chengxiImg, 'chengxi', drawH);
    if (sprite) ctx.drawImage(sprite, -sprite.width / 2, -315);
    else { ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.arc(0, -250, 25, 0, Math.PI*2); ctx.fill(); ctx.fillRect(-30, -225, 60, 120); }
    ctx.restore();
  },

  renderXiangMu(x, y, dir) {
    const ctx = this.ctx; ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(0, 8, 42, 12, 0, 0, Math.PI * 2); ctx.fill();
    const drawH = 350;
    const sprite = this.getScaledSprite(Assets.xiangmuImg, 'xiangmu', drawH);
    if (sprite) ctx.drawImage(sprite, -sprite.width / 2, -335);
    else { ctx.fillStyle = '#aaa'; ctx.beginPath(); ctx.arc(0, -270, 25, 0, Math.PI*2); ctx.fill(); ctx.fillRect(-35, -245, 70, 130); }
    ctx.restore();
  },
  loop() {
    if (!this._running) return;
    this._raf = requestAnimationFrame(this._boundLoop);
    this.update();
    if (this._elOverlay.classList.contains('show')) return;
    if (this.needsRedraw()) this.draw();
  }
};

var Puzzle = {
  type: 1, isTouch: false, overload: 0, clarity: 0.1, val1: 0, val2: 0, isVReady: false, isAReady: false, phase: 0, recordAngle: 0, targetR: 60, hitCount: 0,
  _rafId: 0,
  open(type) {
    this.type = type; document.getElementById('puzzle-overlay').classList.add('show');
    this.vC = document.getElementById('vision-canvas'); this.vCtx = this.vC.getContext('2d', { alpha: false }); this.vC.width = 300; this.vC.height = 90;
    this.wC = document.getElementById('waveform-canvas'); this.wCtx = this.wC.getContext('2d', { alpha: false }); this.wC.width = 300; this.wC.height = 90;
    this.isTouch = false; this.overload = 0; this.clarity = 0.1; this.val1 = 0; this.val2 = 0; this.hitCount = 0; this.targetR = 60; this.isVReady = false; this.isAReady = false;
    this._lastOverload = -1; this._lastVStat = ''; this._lastATitle = '';
    const s1 = document.getElementById('slider1'); if (s1) s1.value = 0; const s2 = document.getElementById('slider2'); if (s2) s2.value = 0;
    document.getElementById('slider1-val-txt').innerText = "0"; document.getElementById('slider2-val-txt').innerText = "0";
    const touchBtn = document.getElementById('p-touch-btn'); touchBtn.onclick = () => this.toggleTouch();
    if (type === 1) {
      document.getElementById('puzzle-title').innerText = "【雙軌共感：泛黃的黑膠】"; document.getElementById('card-audio').style.display = "flex"; document.getElementById('slider-area').style.display = "block"; document.getElementById('p-touch-btn').style.display = "block"; document.getElementById('touch-ui-area').style.display = "block"; document.getElementById('p-rhythm-btn').style.display = "none"; document.getElementById('sync-act-btn').style.display = "block"; touchBtn.style.background = "var(--panel-bg)"; touchBtn.style.color = "#fff"; touchBtn.innerText = "🖐 點擊觸摸黑膠 (再次點擊鬆手)";
    } else if (type === 2) {
      document.getElementById('puzzle-title').innerText = "【時間軸：無聲的共感夢境】"; document.getElementById('card-audio').style.display = "flex"; document.getElementById('slider1-label').innerText = "時間點"; document.getElementById('slider2-label').innerText = "環境音軌"; document.getElementById('p-touch-btn').style.display = "none"; document.getElementById('touch-ui-area').style.display = "none"; document.getElementById('p-rhythm-btn').style.display = "none"; document.getElementById('sync-act-btn').style.display = "block";
    } else if (type === 3) {
      document.getElementById('puzzle-title').innerText = "【鏡中獨舞：抓準重心節奏】"; document.getElementById('card-audio').style.display = "none"; document.getElementById('sync-act-btn').style.display = "none"; document.getElementById('p-touch-btn').style.display = "none"; document.getElementById('touch-ui-area').style.display = "none"; document.getElementById('p-rhythm-btn').style.display = "block"; document.getElementById('p-rhythm-btn').innerText = "🎵 跟隨舞步 (抓準光圈重合)"; document.getElementById('p-rhythm-btn').style.background = "var(--memory)";
    }
    this.eval(); this.puzzleLoop();
  },
  close() { document.getElementById('puzzle-overlay').classList.remove('show'); if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = 0; } this.isTouch = false; this.overload = 0; World.activePrompt = null; document.getElementById('interact-prompt').style.display = 'none'; },
  toggleTouch() {
    if (this.type !== 1) return; this.isTouch = !this.isTouch; const btn = document.getElementById('p-touch-btn');
    if (this.isTouch) { btn.style.background = "var(--memory)"; btn.style.color = "#000"; btn.innerText = "🖐 正在觸摸... (注意過載！)"; } else { btn.style.background = "var(--panel-bg)"; btn.style.color = "#fff"; btn.innerText = "🖐 點擊觸碰黑膠 (再次點擊鬆手)"; }
  },
  onSlider1(v) { this.val1 = parseInt(v); document.getElementById('slider1-val-txt').innerText = this.val1; this.eval(); },
  onSlider2(v) { this.val2 = parseInt(v); document.getElementById('slider2-val-txt').innerText = this.val2; this.eval(); },
  eval() {
    const vStat = document.getElementById('p-v-status'); const aStat = document.getElementById('p-a-status');
    if (this.type === 1) { this.isAReady = (this.val1 >= 20 && this.val2 >= 60 && this.val2 <= 90); aStat.innerText = this.isAReady ? "【人聲鎖定】" : "高噪訊..."; aStat.style.color = this.isAReady ? "var(--green)" : "var(--danger)"; }
    else if (this.type === 2) { this.isVReady = (this.val1 > 70 && this.val1 < 85); this.isAReady = (this.val2 > 75 && this.val2 < 90); vStat.innerText = this.isVReady ? "【畫面重疊】" : "殘影破碎"; vStat.style.color = this.isVReady ? "var(--memory)" : "#8b949e"; aStat.innerText = this.isAReady ? "【音軌咬合】" : "頻率錯位"; aStat.style.color = this.isAReady ? "var(--green)" : "var(--danger)"; }
    const syncBtn = document.getElementById('sync-act-btn');
    if (this.type !== 3) {
      if (this.isVReady && this.isAReady) { syncBtn.className = 'sync-act-btn ready'; syncBtn.innerText = "✨ 記憶已完全對齊！點擊同步 ✨"; }
      else { syncBtn.className = 'sync-act-btn'; if (!this.isVReady && !this.isAReady) syncBtn.innerText = "⚠️ 畫面與頻率皆未對齊"; else if (!this.isVReady) syncBtn.innerText = "⚠️ 畫面尚未聚焦"; else if (!this.isAReady) syncBtn.innerText = "⚠️ 聲音頻率未鎖定"; }
    }
  },
  hitRhythm() {
    const btn = document.getElementById('p-rhythm-btn');
    if (this.targetR > 15 && this.targetR < 35) {
      this.hitCount++; this.targetR = 60;
      if (this.hitCount === 3) { btn.innerText = `⚠️ 失去平衡！`; btn.style.background = "var(--danger)"; setTimeout(() => { this.close(); Flow.afterDancePuzzle(); }, 600); }
      else { btn.innerText = `🎵 完美對齊！(${this.hitCount}/3)`; btn.style.background = "var(--green)"; setTimeout(() => { if (document.getElementById('puzzle-overlay').classList.contains('show')) { btn.style.background = "var(--memory)"; btn.innerText = "🎵 跟隨舞步 (抓準光圈重合)"; } }, 500); }
    } else {
      this.hitCount = 0; this.targetR = 60; btn.innerText = "❌ 節奏錯誤，重新抓拍！"; btn.style.background = "var(--danger)"; setTimeout(() => { if (document.getElementById('puzzle-overlay').classList.contains('show')) { btn.style.background = "var(--memory)"; btn.innerText = "🎵 跟隨舞步 (抓準光圈重合)"; } }, 600);
    }
  },
  attemptSync() { if (this.isVReady && this.isAReady) { this.close(); if (this.type === 1) { Flow.afterVinylPuzzle(); } else if (this.type === 2) { Flow.afterDreamPuzzle(); } } },
  puzzleLoop() {
    if (!document.getElementById('puzzle-overlay').classList.contains('show')) { this._rafId = 0; return; }
    this._rafId = requestAnimationFrame(() => this.puzzleLoop());
    this.vCtx.fillStyle = "#05070a"; this.vCtx.fillRect(0, 0, 300, 90);
    if (this.type === 1) {
      this.overload = this.isTouch ? Math.min(100, this.overload + 0.3) : Math.max(0, this.overload - 0.8); this.clarity = this.isTouch ? Math.min(1.0, this.clarity + 0.02) : Math.max(0.1, this.clarity - 0.02);
      if (this.overload >= 100) { this.toggleTouch(); this.overload = 0; this.clarity = 0.1; alert("【過載】程曦手一抖，唱片差點掉落！"); }
      const ow = Math.round(this.overload);
      if (ow !== this._lastOverload) { this._lastOverload = ow; document.getElementById('p-overload-bar').style.width = ow + '%'; }
      this.isVReady = (this.clarity >= 0.85 && this.overload < 90);
      const vStat = document.getElementById('p-v-status');
      const txt = this.isVReady ? "【殘影清晰】" : (this.isTouch ? "聚焦中..." : "未觸摸");
      if (txt !== this._lastVStat) { this._lastVStat = txt; vStat.innerText = txt; vStat.style.color = this.isVReady ? "var(--memory)" : "#8b949e"; }
      this.eval();
      this.vCtx.save(); this.vCtx.translate(150, 45); this.recordAngle += this.isTouch ? 0.05 : 0.01; this.vCtx.rotate(this.recordAngle); this.vCtx.fillStyle = "#111"; this.vCtx.beginPath(); this.vCtx.arc(0, 0, 40, 0, Math.PI*2); this.vCtx.fill(); this.vCtx.restore();
    } else if (this.type === 2) {
      let offset = Math.abs(75 - this.val1); this.vCtx.globalAlpha = Math.max(0.2, 1 - (offset * 0.02)); this.vCtx.fillStyle = "#58a6ff"; this.vCtx.fillRect(140 - offset, 30, 15, 30); this.vCtx.fillStyle = "#e5b544"; this.vCtx.fillRect(160 + offset, 35, 12, 25); this.vCtx.globalAlpha = 1.0;
    } else if (this.type === 3) {
      this.vCtx.fillStyle = "#e5b544"; this.vCtx.fillRect(145, 30, 10, 30); this.vCtx.strokeStyle = "#fff"; this.vCtx.beginPath(); this.vCtx.arc(150, 45, 25, 0, Math.PI*2); this.vCtx.stroke(); this.targetR -= 0.6; if (this.targetR < 10) this.targetR = 60; this.vCtx.strokeStyle = "rgba(88,166,255,0.8)"; this.vCtx.beginPath(); this.vCtx.arc(150, 45, this.targetR, 0, Math.PI*2); this.vCtx.stroke();
      const t = `節奏判定 (第 ${this.hitCount + 1}/3 步：${['旋轉','跨步','單腳重心前傾'][this.hitCount] || ''})`;
      if (t !== this._lastATitle) { this._lastATitle = t; document.getElementById('v-title').innerText = t; }
    }
    if (this.type !== 3) {
      this.wCtx.fillStyle = "#030406"; this.wCtx.fillRect(0, 0, 300, 90); this.wCtx.strokeStyle = this.isAReady ? "#3fb950" : "#f85149"; this.wCtx.beginPath();
      for(let i=0; i<=30; i++) { const x = i*10; const y = 45 + Math.sin(i*0.4 + this.phase) * (this.isAReady ? 10 : 30) * (this.isAReady ? Math.sin(i*0.3+this.phase) : (Math.random()-0.5)*2); if(i===0) this.wCtx.moveTo(x,y); else this.wCtx.lineTo(x,y); }
      this.wCtx.stroke(); this.phase += 0.15;
    }
  }
};

window.addEventListener('DOMContentLoaded', () => { 
  World.init(); 
  Sound.init(); 
});
